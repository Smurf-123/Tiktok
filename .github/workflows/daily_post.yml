name: Tägliches TikTok-Video

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg installieren
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python-Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Pipeline ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: "SELF_ONLY"
        run: python main.py

      - name: Verarbeitete Video-IDs zurückspeichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f processed_videos.json ]; then
            git add processed_videos.json
            git diff --staged --quiet || git commit -m "Update processed_videos.json"
            git push
          else
            echo "processed_videos.json existiert noch nicht (kein neues Video verarbeitet) - nichts zu committen."
          fi
